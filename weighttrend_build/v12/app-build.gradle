plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.petern.weighttrend'
    compileSdk 36

    defaultConfig {
        applicationId 'za.co.petern.weighttrend'
        minSdk 34
        targetSdk 36
        versionCode 12
        versionName '0.12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
