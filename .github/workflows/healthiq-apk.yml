name: HealthIQ APK build
on:
  push:
    branches:
      - healthiq-apk-build
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract HealthIQ project
        run: unzip -q healthiq/source.zip -d /tmp/healthiq
      - name: Compile Android debug APK
        working-directory: /tmp/healthiq/HealthIQ-Android
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HealthIQ-Android-APK
          path: /tmp/healthiq/HealthIQ-Android/app/build/outputs/apk/debug/app-debug.apk