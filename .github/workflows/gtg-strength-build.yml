name: Build GTG Strength APK

on:
  push:
    branches: [gtg-apk-build]
    paths:
      - '.github/workflows/gtg-strength-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and update GTG project
        run: |
          rm -rf gtg-build/project gtg-build/GTGStrength-reconstructed.zip
          cat gtg-build/zip.b64.part00 gtg-build/zip.b64.part01 gtg-build/zip.b64.part02 gtg-build/zip.b64.part03 gtg-build/zip.b64.part04 | base64 -d > gtg-build/GTGStrength-reconstructed.zip
          unzip -t gtg-build/GTGStrength-reconstructed.zip
          mkdir -p gtg-build/project
          unzip -q gtg-build/GTGStrength-reconstructed.zip -d gtg-build/project

          # Stable API-36-compatible build toolchain.
          sed -i 's/compileSdk = 37/compileSdk = 36/' gtg-build/project/GTGStrength/app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.06.00/g' gtg-build/project/GTGStrength/app/build.gradle.kts

          # Overlay GTG v29 with looping, manually dismissible workout alarms.
          cp -a gtg-build/overlay/app/src/main/java/. gtg-build/project/GTGStrength/app/src/main/java/
          if [ -d gtg-build/overlay/app/src/main/res ]; then
            cp -a gtg-build/overlay/app/src/main/res/. gtg-build/project/GTGStrength/app/src/main/res/
          fi
          if [ -d gtg-build/overlay/app/src/test/java ]; then
            cp -a gtg-build/overlay/app/src/test/java/. gtg-build/project/GTGStrength/app/src/test/java/
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          # Permanently lock the app to portrait orientation.
          manifest = 'gtg-build/project/GTGStrength/app/src/main/AndroidManifest.xml'
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          activities = root.findall('.//activity')
          if not activities:
              raise RuntimeError('No Android activities found in manifest')
          for activity in activities:
              activity.set(f'{{{android_ns}}}screenOrientation', 'portrait')

          # Register the two home-screen widget providers.
          application = root.find('application')
          if application is None:
              raise RuntimeError('No Android application element found in manifest')

          # Permissions needed for haptics, alerts and reboot recovery.
          for permission_name in [
              'android.permission.VIBRATE',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.SCHEDULE_EXACT_ALARM',
          ]:
              if not any(
                  item.get(f'{{{android_ns}}}name') == permission_name
                  for item in root.findall('uses-permission')
              ):
                  permission = ET.Element('uses-permission')
                  permission.set(f'{{{android_ns}}}name', permission_name)
                  root.insert(list(root).index(application), permission)

          widget_receivers = [
              ('.widget.TodayWidgetProvider', '@xml/widget_today_info'),
              ('.widget.ProgressWidgetProvider', '@xml/widget_progress_info'),
          ]
          for class_name, info_resource in widget_receivers:
              existing = application.find(f"receiver[@{{{android_ns}}}name='{class_name}']")
              receiver = existing if existing is not None else ET.SubElement(application, 'receiver')
              receiver.set(f'{{{android_ns}}}name', class_name)
              receiver.set(f'{{{android_ns}}}exported', 'false')

              if existing is None:
                  intent_filter = ET.SubElement(receiver, 'intent-filter')
                  action = ET.SubElement(intent_filter, 'action')
                  action.set(f'{{{android_ns}}}name', 'android.appwidget.action.APPWIDGET_UPDATE')
                  meta = ET.SubElement(receiver, 'meta-data')
                  meta.set(f'{{{android_ns}}}name', 'android.appwidget.provider')
                  meta.set(f'{{{android_ns}}}resource', info_resource)

          # Fire notifications only for a still-valid timer; restore after reboot.
          alarm_receiver = ET.SubElement(application, 'receiver')
          alarm_receiver.set(f'{{{android_ns}}}name', '.alarms.CooldownAlarmReceiver')
          alarm_receiver.set(f'{{{android_ns}}}exported', 'false')
          boot_filter = ET.SubElement(alarm_receiver, 'intent-filter')
          boot_action = ET.SubElement(boot_filter, 'action')
          boot_action.set(f'{{{android_ns}}}name', 'android.intent.action.BOOT_COMPLETED')

          # Register the alarm playback foreground service and large STOP screen.
          ringing_service = ET.SubElement(application, 'service')
          ringing_service.set(f'{{{android_ns}}}name', '.alarms.CooldownRingingService')
          ringing_service.set(f'{{{android_ns}}}exported', 'false')
          ringing_service.set(f'{{{android_ns}}}foregroundServiceType', 'mediaPlayback')

          stop_activity = ET.SubElement(application, 'activity')
          stop_activity.set(f'{{{android_ns}}}name', '.alarms.CooldownAlarmActivity')
          stop_activity.set(f'{{{android_ns}}}exported', 'false')
          stop_activity.set(f'{{{android_ns}}}screenOrientation', 'portrait')

          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # Use a Sunday-based calendar week number in History.
          log_screen = Path('gtg-build/project/GTGStrength/app/src/main/java/com/petern/gtgstrength/ui/TrainingLogScreen.kt')
          text = log_screen.read_text()
          pattern = r'private fun weekLabel\(start: LocalDate\): String \{.*?\n\}\n\nprivate fun dayLabel'
          week_function = "\n".join([
              'private fun weekLabel(start: LocalDate): String {',
              '    val weekFields = java.time.temporal.WeekFields.of(DayOfWeek.SUNDAY, 1)',
              '    val weekNumber = start.get(weekFields.weekOfYear())',
              '    return "Week $weekNumber"',
              '}',
              '',
              'private fun dayLabel'
          ])
          text, replacements = re.subn(pattern, week_function, text, flags=re.S)
          if replacements != 1:
              raise RuntimeError(f'Expected one weekLabel replacement, got {replacements}')
          log_screen.write_text(text)
          PY

      - name: Run unit tests
        working-directory: gtg-build/project/GTGStrength
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: gtg-build/project/GTGStrength
        run: gradle --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTGStrength-v29-apk
          path: gtg-build/project/GTGStrength/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
