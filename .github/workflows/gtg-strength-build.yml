name: Build GTG Strength APK

on:
  push:
    branches: [gtg-apk-build]
    paths:
      - '.github/workflows/gtg-strength-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and update GTG project
        run: |
          rm -rf gtg-build/project gtg-build/GTGStrength-reconstructed.zip
          cat gtg-build/zip.b64.part00 gtg-build/zip.b64.part01 gtg-build/zip.b64.part02 gtg-build/zip.b64.part03 gtg-build/zip.b64.part04 | base64 -d > gtg-build/GTGStrength-reconstructed.zip
          unzip -t gtg-build/GTGStrength-reconstructed.zip
          mkdir -p gtg-build/project
          unzip -q gtg-build/GTGStrength-reconstructed.zip -d gtg-build/project

          # Keep the project on the stable API-36-compatible toolchain.
          sed -i 's/compileSdk = 37/compileSdk = 36/' gtg-build/project/GTGStrength/app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.06.00/g' gtg-build/project/GTGStrength/app/build.gradle.kts

          # Overlay the latest GTG sources.
          cp -a gtg-build/overlay/app/src/main/java/. gtg-build/project/GTGStrength/app/src/main/java/

          # v6 layout: move the calculator off Dashboard into Settings, remove
          # the GTG rule card, and put Today's Progress above Weekly Progress.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('gtg-build/project/GTGStrength/app/src/main/java/com/petern/gtgstrength/ui')

          dashboard = root / 'DashboardScreen.kt'
          s = dashboard.read_text()
          start = s.index('        SettingsCard(\n')
          end = s.index('        TargetCard(\n', start)
          s = s[:start] + s[end:]

          rule_marker = 'GTG rule: every rep should stay crisp.'
          marker_pos = s.index(rule_marker)
          card_start = s.rfind('        Card(\n', 0, marker_pos)
          spacer_start = s.index('        Spacer(Modifier.height(8.dp))', marker_pos)
          s = s[:card_start] + s[spacer_start:]
          dashboard.write_text(s)

          log = root / 'TrainingLogScreen.kt'
          s = log.read_text()
          weekly_call = '                WeeklyProgressSection(uiState)\n\n'
          if weekly_call not in s:
              raise SystemExit('Weekly progress call not found in TrainingLogScreen')
          s = s.replace(weekly_call, '', 1)
          history_marker = '                Text(\n                    text = "History",'
          history_pos = s.index(history_marker)
          s = s[:history_pos] + '                WeeklyProgressSection(uiState)\n\n' + s[history_pos:]
          log.write_text(s)
          PY

          grep -RIn 'targetSetsPerExercise\|settings.repsPerSet\|setTargetSets\|setRepsPerSet' gtg-build/project/GTGStrength/app/src/main && exit 1 || true

      - name: Run unit tests
        working-directory: gtg-build/project/GTGStrength
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: gtg-build/project/GTGStrength
        run: gradle --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTGStrength-v6-apk
          path: gtg-build/project/GTGStrength/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
