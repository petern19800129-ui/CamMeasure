name: Build UnifiedContact APK

on:
  push:
    branches: [ unifiedcontact-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate UnifiedContact source
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/UnifiedContact.zip.b64" <<'EOF'

EOF
          base64 -d "$RUNNER_TEMP/UnifiedContact.zip.b64" > "$RUNNER_TEMP/UnifiedContact.zip"
          cd "$RUNNER_TEMP"
          unzip -q UnifiedContact.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/UnifiedContact
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f "$RUNNER_TEMP/UnifiedContact/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$RUNNER_TEMP/UnifiedContact/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/UnifiedContact/app/build/outputs/apk/debug/app-debug.apk" | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedContact-debug-apk
          path: ${{ runner.temp }}/UnifiedContact/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
