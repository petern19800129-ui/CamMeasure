name: Build Weight Trend APK

on:
  push:
    branches:
      - weighttrend-build-20260913
    paths:
      - 'weighttrend_build/source-v0.2.zip.b64'
      - '.github/workflows/weighttrend-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct Weight Trend v0.2 project
        shell: bash
        run: |
          base64 --decode weighttrend_build/source-v0.2.zip.b64 > /tmp/weighttrend-v0.2-source.zip
          echo '620b0d659c26f878e55ef69c0ec4bc87dac29388fa9b10446a20fe33fe9904db  /tmp/weighttrend-v0.2-source.zip' | sha256sum --check
          mkdir -p weighttrend_src
          unzip -q /tmp/weighttrend-v0.2-source.zip -d weighttrend_src

      - name: Build debug APK
        working-directory: weighttrend_src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeightTrend-v0.2-debug-apk
          path: weighttrend_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
