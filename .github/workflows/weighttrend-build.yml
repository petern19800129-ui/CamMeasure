name: Build Weight Trend APK

on:
  push:
    branches:
      - weighttrend-build-20260913
    paths:
      - 'weighttrend_build/v04/**'
      - '.github/workflows/weighttrend-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct proven source and apply v0.4 pinch zoom
        shell: bash
        run: |
          cat weighttrend_build/source.part1 weighttrend_build/source.part2 weighttrend_build/source.part3 weighttrend_build/source.part4 | base64 --decode > /tmp/weighttrend-base.zip
          echo '72b9e8bdbfabacfa35c4787dc373c2e2fcf6f5ba04462a7fda4b2109e3775cbb  /tmp/weighttrend-base.zip' | sha256sum --check
          mkdir -p weighttrend_src
          unzip -q /tmp/weighttrend-base.zip -d weighttrend_src
          cp weighttrend_build/v02/TrendCalculator.java weighttrend_src/app/src/main/java/za/co/petern/weighttrend/TrendCalculator.java
          cp weighttrend_build/v02/MainActivity.java weighttrend_src/app/src/main/java/za/co/petern/weighttrend/MainActivity.java
          cp weighttrend_build/v03/DataRepository.java weighttrend_src/app/src/main/java/za/co/petern/weighttrend/DataRepository.java
          cp weighttrend_build/v04/WeightChartView.java weighttrend_src/app/src/main/java/za/co/petern/weighttrend/WeightChartView.java
          cp weighttrend_build/v04/app-build.gradle weighttrend_src/app/build.gradle
          echo '02e8f231b6f71de73c1ffeab6d7f55cef3b658835aae4fee39ee5909f39fe7b9  weighttrend_src/app/src/main/java/za/co/petern/weighttrend/TrendCalculator.java' | sha256sum --check
          echo 'e06383057141202880dd5ea5135e494b08074e1c0bdf8fd3a86b1bfbc20671de  weighttrend_src/app/src/main/java/za/co/petern/weighttrend/MainActivity.java' | sha256sum --check
          echo '5c8dfaa33d4c877c0e0ccce4c90085c4f005ea40bd28e540ffb77a0b14d0d49b  weighttrend_src/app/src/main/java/za/co/petern/weighttrend/DataRepository.java' | sha256sum --check
          echo 'c4f0d6247ba59ac0d74abab3e8aa0848d16cbaadb0767fe882a9bb1e845c5f6d  weighttrend_src/app/src/main/java/za/co/petern/weighttrend/WeightChartView.java' | sha256sum --check
          echo 'e22ce8bcddff84222d2c336d7db5c603d32bf359299937e8aa4aa2f0dc52c409  weighttrend_src/app/build.gradle' | sha256sum --check

      - name: Build debug APK
        working-directory: weighttrend_src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeightTrend-v0.4-debug-apk
          path: weighttrend_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
