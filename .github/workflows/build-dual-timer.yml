name: Build Dual Timer APK

on:
  push:
    branches: [ dual-timer-apk-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: dualtimer
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp dualtimer/app/build/outputs/apk/debug/app-debug.apk DualTimer-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualTimer-v1.0-apk
          path: DualTimer-v1.0.apk
          if-no-files-found: error
